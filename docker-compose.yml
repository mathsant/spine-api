# Legacy/optional: local MongoDB for dev without Atlas. The app connects via
# MONGO_URI (see .env.example) — this container is not required for `pnpm dev`
# when MONGO_URI points at an Atlas cluster.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '${MONGO_PORT:-27017}:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongo-data:
